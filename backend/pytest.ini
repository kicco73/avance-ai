[pytest]
pythonpath = . src tests
testpaths = tests src
# pytest's own default excludes a directory called "build" — which is a
# skill here, with its own tests inside it (see docs/TESTS.md). This is
# that default with "build" taken out; "builds" (the artifacts directory
# at the backend root) is a different name and outside testpaths anyway.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch}
asyncio_mode = auto
markers =
    regression: verifies a specific, punctual behavior/fix continues to hold
    contract: verifies an interface/structure the system must keep respecting (response shape, event order, method signature, data schema)
    needs_review: type (regression vs contract) or current validity could not be determined with confidence
    slow: spawns a real subprocess (or otherwise takes several seconds) — excluded from a fast/targeted run
    spawns_a_build: builds a backend copy and runs its tests — deselected inside a build's own test run, which would otherwise build a backend that builds a backend
