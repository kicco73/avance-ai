# Application configuration for the Avance backend (replaces the old .env).
# Copy this file to .config.yml and fill in your values.
# .config.yml is gitignored (it holds secrets); this example file is not.

database:
  # Peewee connection URL (see backend/db.py). sqlite:///path.db for SQLite,
  # mysql://user:pass@host/dbname for MySQL (requires adding a MySQL driver
  # such as pymysql to requirements.txt — not included by default).
  url: sqlite:///avance.db
  # Optional, defaults to false. If true, an existing database whose
  # on-disk schema doesn't match what this code expects (e.g. after an
  # upgrade that renamed/removed a column) is dropped and recreated from
  # scratch at startup instead of being left for a human to migrate or
  # restore by hand. Destructive — every table's data is lost when this
  # actually triggers. Leave false unless you specifically want that.
  force-drop-and-create-when-incompatible: false

chat-service:
  # Optional, defaults to 60. How long (in minutes) a chat session stays
  # "open" — i.e. still writable — after its last activity (see
  # chat/session_manager.py's ChatSessionManager). The single source of
  # truth for this duration; nothing else hardcodes it.
  max-session-duration-in-minutes: 60
  # Optional, defaults to 16000. Caps how much of a session's own message
  # history a turn's prompt can carry: walking backward from the latest
  # message, as many messages as fit within this many cumulative tokens
  # (see Message.tokens) are sent — combined with a project state's own
  # history-cutoff (index.yml), never a replacement for it (see
  # db/messages.py's get_turn_history).
  input-token-budget-per-turn: 16000
  # Optional, defaults to 200000. Display-only: the max reference the
  # session detail's tokens bar is drawn against (see
  # SessionDetailCard.vue) — nothing in the backend trims history
  # against it.
  total-token-budget-per-session: 200000

jobs:
  # Optional section — can be omitted entirely. Sizes the general
  # job_queue (see jobs/job_queue.py's JobQueue) shared by chat, wakeup,
  # session-summary, etc. A job beyond the pool's size just waits its
  # turn — never rejected.
  shared-max-concurrent: 2

test-service:
  # Optional section — can be omitted entirely, and each field within it
  # is independently optional too. Sizes TestService's own throttled
  # queue (see jobs/throttled_job_queue.py's ThrottledJobQueue).
  max-concurrent-tests: 4
  # Caps how many test job steps run per rolling 60s window, and the
  # minimum spacing (ms) between any two of them.
  max-tests-per-minute: 15
  min-test-interval-ms: 0

project-service:
  # Optional section — can be omitted entirely, and each field within it
  # is independently optional too. Governs "share project" invite links
  # (see project/invites.py's InviteManager) — a fresh Invite row (own
  # random code) is generated every time the Share dialog opens.
  # How many days a freshly generated invite code stays redeemable,
  # counted from the moment it's created.
  invite-valid-days: 7
  # How many new registrations a single invite code can carry before
  # AuthService.complete_registration starts refusing it (self-
  # registration is invite-only — see AcceptTermsRequest).
  invite-max-shares: 3

ai-service:
  # Optional. Passed as max_tokens/max_output_tokens to
  # every provider below — the ceiling a single structured-output call
  # (chat turn, or a test-panel batch call covering several turns at
  # once) can reach before the provider reports the response as
  # truncated (see AIServiceProviderOutputTruncatedError in ai/llm_provider.py)
  # instead of silently handing back a cut-off trailing field.
  max-output-tokens: 1024

  providers:
    # Always a list, even with a single entry. Cascades in order (see
    # ai/ai_service.py's AiService): the first provider is tried first,
    # later ones are only used as a fallback if an earlier one becomes
    # unavailable (rate limit/quota, or an outage that outlasts retries).
    - driver: gemini
      model: gemini-flash-lite-latest
      key: <your-gemini-api-key>
      # Both optional. ui-label is what the frontend's model menu shows for
      # this entry — falls back to `driver` (e.g. "gemini") if omitted.
      # ui-description is an optional longer blurb shown alongside it.
      # ui-label: Gemini Flash Lite
      # ui-description: Google's fastest Gemini model.

talk-service:
  # Optional, defaults to false (and the whole section can be omitted
  # entirely). If not true, no TalkService is built: audio endpoints
  # respond with TalkServiceNotAvailableError (see controller.py) instead
  # of failing to boot for lack of a TTS provider. `providers` is only
  # required when true.
  enabled: true
  providers:
    # Same shape/cascade as ai-service, but a fully independent provider
    # roster and fallback pointer (see talk/talk_service.py's
    # TalkService) — even when it happens to reuse the same key as
    # ai-service, as here. `key` is optional: a future local provider
    # (e.g. Piper) won't need one.
    - driver: gemini
      model: gemini-2.5-flash-preview-tts
      key: <your-gemini-api-key>
      # ui-label/ui-description: same optional fields as ai-service above.

listen-service:
  # Same optional, default-off shape as talk-service.enabled — see above.
  enabled: true
  providers:
    # Same shape/cascade as ai-service/talk-service. faster-whisper is
    # fully local (no key needed) and downloads/caches its own model on
    # first use — nothing to place by hand. `language` is optional: if
    # given, skips faster-whisper's own autodetect.
    - driver: faster-whisper
      model: small
      language: ca
      # ui-label/ui-description: same optional fields as ai-service above.

auth-service:
  # Not provider-specific — needed regardless of which provider below
  # actually authenticates the user.
  jwt-secret: <your-jwt-secret>
  providers:
    # `key` is mandatory here (unlike talk-service/listen-service): for
    # google it's the OAuth client ID. Interpreting it is the provider
    # implementation's job, not this schema's.
    - driver: google
      key: <your-google-client-id>
      # ui-label/ui-description: same optional fields as ai-service above.
