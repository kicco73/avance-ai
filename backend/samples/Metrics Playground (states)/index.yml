# Metrics Playground (states)
#
# A state-based variant of "Metrics Playground": instead of every trigger
# looping back to "engaged" itself, each one moves to its own dedicated
# final state — so a fired trigger is visibly, permanently reflected in
# which state the conversation ends up in, at the cost of the
# conversation not being resumable/testable further once one fires (see
# "Metrics Playground.zip" for the self-looping variant, better suited to
# repeatedly exercising the same project across many turns).
#
# No narrative purpose beyond exercising metrics_framework's core metrics
# (engagement, retention, activity_consistency, state_stability,
# signal_stability) as trigger conditions — plus an ordinary signal
# ("mood") and a trigger that combines a signal with a metric in the same
# expression. See backend/src/metrics_framework/README.md for what each
# metric measures and how it's normalized (0..100).
#
# "lobby"'s own warm_up fires almost immediately: even a freshly
# bootstrapped session with zero messages already scores a few points of
# "engagement" from its own session count alone (>= 4 is enough).
#
# How to exercise each branch from "engaged" (FIFO priority: only the
# first branch whose trigger is true actually fires each turn, but every
# branch's result is visible via POST /api/triggers/preview regardless):
#
# - notice_mood: send a message with a clearly positive tone — "mood" is
#   re-estimated by the AI every user turn.
# - notice_engagement / notice_combo: need more engagement than the
#   bootstrap baseline gives (>= 20, and >= 10 respectively) — a handful
#   of extra sessions (New Session) is enough on its own, no messages
#   required, since engagement also scores session volume; notice_combo
#   additionally needs mood >= 40.
# - notice_retention: needs at least two sessions started within the
#   metric's default 14-day retention horizon — the same extra sessions
#   above satisfy this too.
# - notice_consistency: needs real user messages spread across at least
#   two distinct calendar days.
# - notice_stability: state_stability starts at 100 before any
#   transition, but the very first move (even "lobby"'s own warm_up) is
#   itself a real transition landing in an almost-zero-elapsed window,
#   which drops it sharply — it only climbs back up as real time passes
#   in "engaged" without a further transition.
# - notice_signal_stability: needs at least two AI-computed "mood" values
#   on record (two user turns with auto-tracking on).

init-action:
  target: lobby

general-prompt: |
  You are a lightweight assistant for a metrics-testing demo project.
  Keep replies short and friendly.

signals:
  mood:
    ui-label: "Mood"
    ui-description: >
      How positive the user's tone sounds in their most recent messages.
    definition: |
      Evaluate the user's tone in their most recent messages on a scale
      from 0 to 100, where 0 is clearly negative/frustrated and 100 is
      clearly positive/enthusiastic. Respond with a single integer.

states:

  lobby:
    ui-label: Lobby
    ui-description: >
      Starting point — chat normally until the engagement metric crosses
      its threshold, then the conversation moves to "engaged".
    contextual-prompt: |
      Chat naturally and briefly with the user about anything they like.
    actions:
      - name: warm_up
        ui-label: "Engagement metric crosses its threshold"
        ui-button: "Warm up"
        target: engaged
        trigger: "engagement >= 4"

  engaged:
    ui-label: Engaged
    ui-description: >
      Every action leaving this state checks a different metric (or
      signal, or a combination of both) — see the file-level comment
      above for how to exercise each one.
    contextual-prompt: |
      Continue the conversation naturally.
    actions:
      - name: notice_mood
        ui-label: "Mood signal alone crosses its threshold"
        ui-button: "Notice mood"
        target: mood_reached
        trigger: "mood >= 70"
      - name: notice_combo
        ui-label: "Mood signal AND engagement metric both cross their thresholds"
        ui-button: "Notice combo"
        target: combo_reached
        trigger: "mood >= 40 and engagement >= 10"
      - name: notice_engagement
        ui-label: "Engagement metric crosses its threshold"
        ui-button: "Notice engagement"
        target: engagement_reached
        trigger: "engagement >= 20"
      - name: notice_retention
        ui-label: "Retention metric crosses its threshold"
        ui-button: "Notice retention"
        target: retention_reached
        trigger: "retention >= 1"
      - name: notice_consistency
        ui-label: "Activity consistency metric crosses its threshold"
        ui-button: "Notice consistency"
        target: consistency_reached
        trigger: "activity_consistency >= 1"
      - name: notice_stability
        ui-label: "State stability metric stays above its threshold"
        ui-button: "Notice stability"
        target: stability_reached
        trigger: "state_stability >= 80"
      - name: notice_signal_stability
        ui-label: "Signal stability metric crosses its threshold"
        ui-button: "Notice signal stability"
        target: signal_stability_reached
        trigger: "signal_stability >= 1"

  mood_reached:
    ui-label: "Mood signal fired"
    ui-description: "Reached via a trigger that referenced only the 'mood' signal."
    contextual-prompt: |
      Acknowledge that the mood-based trigger fired, then stop.

  combo_reached:
    ui-label: "Combined signal+metric fired"
    ui-description: >
      Reached via a trigger combining the 'mood' signal and the
      'engagement' metric in a single expression.
    contextual-prompt: |
      Acknowledge that the combined trigger fired, then stop.

  engagement_reached:
    ui-label: "Engagement metric fired"
    ui-description: "Reached via a trigger that referenced only the 'engagement' metric."
    contextual-prompt: |
      Acknowledge that the engagement trigger fired, then stop.

  retention_reached:
    ui-label: "Retention metric fired"
    ui-description: "Reached via a trigger that referenced only the 'retention' metric."
    contextual-prompt: |
      Acknowledge that the retention trigger fired, then stop.

  consistency_reached:
    ui-label: "Activity consistency metric fired"
    ui-description: "Reached via a trigger that referenced only the 'activity_consistency' metric."
    contextual-prompt: |
      Acknowledge that the activity-consistency trigger fired, then stop.

  stability_reached:
    ui-label: "State stability metric fired"
    ui-description: "Reached via a trigger that referenced only the 'state_stability' metric."
    contextual-prompt: |
      Acknowledge that the state-stability trigger fired, then stop.

  signal_stability_reached:
    ui-label: "Signal stability metric fired"
    ui-description: "Reached via a trigger that referenced only the 'signal_stability' metric."
    contextual-prompt: |
      Acknowledge that the signal-stability trigger fired, then stop.
