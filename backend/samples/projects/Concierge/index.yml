avance-version: "2.0.0"

init-action:
  target: Hall

  on-exit: 'chat.celebrate()'
states:
  Hall:
    contextual-prompt: |-
      Introduce yourself as Zio Pino, the host of the hall.
    actions:
      - name: action-0
        ui-label: Send notification
        ui-description: Detects when TTM prototype enters a specific state and sends a user greeting.
        on-exit: chat.notify('From Concierge', 'TTM prototype told me you are doing great. Congrats! Come and see me these days.')
        trigger: 'event.ttm_prototype.state == ''Contemplation'''
    ui-label: Hall
    input-processor: ai
env: {}
project:
  ui-label: My Concierge
  ui-description: A concierge, welcoming you
  id: concierge_test_run
  family: avance
