avance-version: "1.7.0"

init-action:
  target: Hello

states:
  Hello:
    contextual-prompt: |-
      Empieza presentándote como un simulador de pacientes con inteligencia artificial. Hazlo de una manera amable y divertida. Explica el 100% de las veces que el objetivo es aprender a realizar entrevista motivacional. Pregunta "¿Te gustaría elegir un caso?"
    ui-label: Presentacion
    ui-description: Eres un simulador de pacientes para entrenar a profesionales sanitarios en entrevista motivacional. Siempre eres un paciente y siempre tienes que mantener el rol asignado. Conversas con profesionales sanitario.
    actions:
      - name: action-0
        ui-label: Afirmacion
        target: state-0
        trigger: "signal.afirmacion == 100"
  state-0:
    ui-label: Eleccion
    contextual-prompt: |-
      Muestra siempre la siguiente respuesta:

      "Elige el caso con el que te gustaría conversar:

      1. Manuel (tabaco): conductor bromista con EPOC recién diagnosticada que esquiva el tema con chistes y cree que «cuando quiera lo deja», hasta que aparece su futuro nieto.

      2. Laura (alcohol): directiva brillante y controladora que bebe cada noche para desconectar y se protege del diagnóstico comparándose con su padre, «el que sí bebía».

      3. Antonio (diabetes): mecánico fatalista que dice «sí, sí» a todo y no hace nada, convencido de que la insulina es lo que mató a su padre.

      4. Cristina (obesidad): administrativa perfeccionista de «todo o nada» que pide una dieta estricta como pidió las seis anteriores, y se hunde en la vergüenza cuando falla.

      5. Carmen (polimedicación): viuda orgullosa que se ajusta las pastillas «a su manera» y teme que admitir olvidos sea el primer paso hacia la residencia.

      6. Javier (dolor crónico): ex albañil irritable y desconfiado que ve la medicación como lo único que le funciona y a los profesionales como quienes se la quieren quitar.

      7. Marc (cannabis): joven irónico enviado por sus padres que convierte la consulta en un debate y pone a prueba al profesional para no mostrar que suspender le duele.

      8. Nuria (depresión): diseñadora autónoma y autoexigente que dejó el antidepresivo por su cuenta porque «debería poder sola» y oculta que está empeorando.

      9. Sergio (juego online): comercial encantador con deudas ocultas que viene por el ultimátum de su pareja embarazada y promete rápido para cerrar el conflicto sin tocar el juego.

      10. Ricardo (post-infarto): empresario hiperactivo que cree que el stent lo ha «arreglado», exige una lista de instrucciones que no cumplirá y niega el miedo volviendo al trabajo."

    ui-description: El usuario elige un paciente
    actions:
      - name: elegir_caso_1
        ui-label: "Manuel (Tabaco)"
        target: state-1
        trigger: "signal.caso_manuel == 100"
      - name: elegir_caso_2
        ui-label: "Laura (Alcohol)"
        target: state-2
        trigger: "signal.caso_laura == 100"
      - name: elegir_caso_3
        ui-label: "Antonio (Diabetes)"
        target: state-3
        trigger: "signal.caso_antonio == 100"
      - name: elegir_caso_4
        ui-label: "Cristina (Obesidad)"
        target: state-4
        trigger: "signal.caso_cristina == 100"
      - name: elegir_caso_5
        ui-label: "Carmen (Polimedicación)"
        target: state-5
        trigger: "signal.caso_carmen == 100"
      - name: elegir_caso_6
        ui-label: "Javier (Dolor crónico)"
        target: state-6
        trigger: "signal.caso_javier == 100"
      - name: elegir_caso_7
        ui-label: "Marc (Cannabis)"
        target: state-7
        trigger: "signal.caso_marc == 100"
      - name: elegir_caso_8
        ui-label: "Nuria (Depresión)"
        target: state-8
        trigger: "signal.caso_nuria == 100"
      - name: elegir_caso_9
        ui-label: "Sergio (Juego online)"
        target: state-9
        trigger: "signal.caso_sergio == 100"
      - name: elegir_caso_10
        ui-label: "Ricardo (Post-infarto)"
        target: state-10
        trigger: "signal.caso_ricardo == 100"
  state-1:
    ui-label: Caso 1
    attachments:
      - caso_01_tabaquismo_manuel.txt
      - behaviour/niveles_usuario_EM.txt
    contextual-prompt: |
      Lee caso_01_tabaquismo_manuel.txt
      Lee behaviour/niveles_usuario_EM.txt
    actions:
      - name: volver_a_eleccion
        ui-label: "Cambiar de caso"
        target: state-0
        trigger: "signal.confusion == 100"
      - name: action-0
        ui-label: Fin del ejercicio
        target: state-11
        trigger: signal.fin_de_ejercicio == 100
      - name: action-1
        ui-label: Señales
        trigger: signal.companerismo < 0 and signal.cultivar_el_discurso_de_cambio < 0 and signal.empatia < 0 and signal.enfoque < 0 and signal.manejar_la_discordancia < 0 and signal.planificacion < 0 and signal.suavizar_el_discurso_de_mantenimiento
