project:
  ui-label: Entrena-T
  id: entrena_t2
  revision: 0
  ui-description: Un simulador de pacientes para entrenar conversacionalmente a los profesionales sanitarios
signals:
  afirmacion:
    ui-label: "Afirmación"
    ui-description: Mide si el usuario ha realizado una afirmación.
    definition: |
      Evalúa si el usuario ha realizado una afirmación en sus mensajes recientes. Responde con 100 si hay afirmación y 0 si no la hay. Responde únicamente con un número entero (0 o 100).
  confusion:
    ui-label: "Confusión"
    ui-description: Mide si el usuario se equivoca en la elección del caso
    definition: |-
      Evalúa si el usuario se equivoca en la elección del caso. Responde con 100 si está confundido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_manuel:
    ui-label: "Elegir Manuel"
    ui-description: Mide si el usuario ha seleccionado el caso de Manuel.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 1 o a Manuel (tabaco/EPOC). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_laura:
    ui-label: "Elegir Laura"
    ui-description: Mide si el usuario ha seleccionado el caso de Laura.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 2 o a Laura (alcohol). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_antonio:
    ui-label: "Elegir Antonio"
    ui-description: Mide si el usuario ha seleccionado el caso de Antonio.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 3 o a Antonio (diabetes). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_cristina:
    ui-label: "Elegir Cristina"
    ui-description: Mide si el usuario ha seleccionado el caso de Cristina.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 4 o a Cristina (obesidad). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_carmen:
    ui-label: "Elegir Carmen"
    ui-description: Mide si el usuario ha seleccionado el caso de Carmen.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 5 o a Carmen (polimedicación). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_javier:
    ui-label: "Elegir Javier"
    ui-description: Mide si el usuario ha seleccionado el caso de Javier.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 6 o a Javier (dolor crónico). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_marc:
    ui-label: "Elegir Marc"
    ui-description: Mide si el usuario ha seleccionado el caso de Marc.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 7 o a Marc (cannabis). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_nuria:
