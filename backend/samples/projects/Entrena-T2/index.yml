    ui-description: Mide si el usuario ha seleccionado el caso de Nuria.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 8 o a Nuria (depresión). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_sergio:
    ui-label: "Elegir Sergio"
    ui-description: Mide si el usuario ha seleccionado el caso de Sergio.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 9 o a Sergio (juego online). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  caso_ricardo:
    ui-label: "Elegir Ricardo"
    ui-description: Mide si el usuario ha seleccionado el caso de Ricardo.
    definition: |
      Evalúa si el usuario ha elegido explícitamente el caso número 10 o a Ricardo (post-infarto). Responde con 100 si lo ha elegido y 0 en caso contrario. Responde únicamente con un número entero (0 o 100).
  companerismo:
    ui-label: "Compañerismo"
    ui-description: mide reparto del poder. El paciente es experto en sí mismo; el profesional pide permiso, pide opinión real, ofrece opciones, acepta el desacuerdo, usa la experiencia del paciente como recurso.
    definition: |
      Read attachment Companerismo.txt
  cultivar_el_discurso_de_cambio:
    ui-label: "Cultivar el discurso de cambio"
    ui-description: mide la capacidad del profesional para evocar y reforzar las razones del paciente para el cambio.
    definition: |
      Read attachment Cultivar el discurso de cambio.txt
  empatia:
    ui-label: "Empatía"
    ui-description: mide la comprensión empática del profesional hacia el paciente.
    definition: |
      Read attachment Empatia.txt
  enfoque:
    ui-label: "Enfoque"
    ui-description: mide la capacidad del profesional para establecer una dirección clara en la conversación.
    definition: |
      Read attachment Enfoque.txt
  manejar_la_discordancia:
    ui-label: "Manejar la discordancia"
    ui-description: mide cómo el profesional gestiona la discordancia o resistencia del paciente.
    definition: |
      Read attachment Manejar la discordancia.txt
  planificacion:
    ui-label: "Planificación"
    ui-description: mide cómo el profesional facilita la creación de un plan de cambio.
    definition: |
      Read attachment Planificacion.txt
  suavizar_el_discurso_de_mantenimiento:
    ui-label: "Suavizar el discurso de mantenimiento"
    ui-description: mide cómo el profesional evita reforzar o avivar el discurso de mantenimiento del cambio.
    definition: |
      Read attachment Suavizar el discurso de mantenimiento.txt

  fin_de_ejercicio:
    ui-label: "Fin de ejercicio"
    definition: Evalúa si el usuario ha expresado deseos de finalizar la conversación. Responde con 100 si hay deseos y 0 si no la hay. Responde únicamente con un número entero (0 o 100)
    ui-description: Mide si el usuario expresa deseos de finalizar la conversación.

  nuevo_caso:
    ui-label: Nuevo caso
    definition: 'Evalúa si el usuario ha expresado deseos de de realizar un nuevo caso. Responde con 100 si hay deseos y 0 si no la hay. Responde únicamente con un número entero (0 o 100)'
    ui-description: Mide si el usuario expresa deseos de realizar un nuevo caso
