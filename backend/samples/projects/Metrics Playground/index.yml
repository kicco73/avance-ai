avance-version: "1.7.0"

# Metrics Playground
#
# No narrative purpose beyond exercising the `session.metric` namespace
# (see tracking.session_facts.SessionFacts.metric) — engagement,
# state_stability, signal_stability, the Analytics Core Metrics scoped to
# just the current session — plus an ordinary signal ("mood") and a
# trigger that combines a signal with a metric in the same expression.
# retention/activity_consistency are deliberately absent here: their own
# scope (see MetricCalculator.scope) is {all_sessions_per_user,
# all_sessions}, never one_session, so `session.metric.retention()` (etc.)
# would never see a defined value — they live under the top-level `metric`
# namespace instead (see metrics.metric_service.MetricService.for_turn),
# which spans the user's whole cross-session history rather than the
# current session alone. See backend/src/metrics_framework/README.md for
# what each metric measures and how it's normalized (0..100).
#
# "lobby"'s own warm_up fires almost immediately: even a freshly
# bootstrapped session with zero messages already scores a few points of
# "engagement" from its own session count alone (>= 4 is enough).
#
# Every action in "engaged" targets "engaged" itself: firing one is a
# self-loop, so the conversation never dead-ends — each one just prompts
# an acknowledgment (via its own action-prompt) and stays put, ready to
# fire again (or a different one) on a later turn. How to exercise each:
#
# - notice_mood: send a message with a clearly positive tone — "mood" is
#   re-estimated by the AI every user turn.
# - notice_engagement / notice_combo: need more engagement than the
#   bootstrap baseline gives (>= 20, and >= 10 respectively) — but
#   session.metric.engagement() is scoped to just the current session (see
#   above), so extra sessions (New Session) alone never move it past its
#   own ~4-point baseline; real user messages in the current session do
#   (roughly 10 of them for notice_combo, 27 for notice_engagement).
#   notice_combo additionally needs mood >= 40.
# - notice_stability: state_stability starts at 100 before any
#   transition, but the very first move (even "lobby"'s own warm_up) is
#   itself a real transition landing in an almost-zero-elapsed window,
#   which drops it sharply — it only climbs back up as real time passes
#   in "engaged" without a further transition.
# - notice_signal_stability: needs at least two AI-computed "mood" values
#   on record (two user turns with auto-tracking on).

init-action:
  target: lobby

general-prompt: |
  You are a lightweight assistant for a metrics-testing demo project.
  Keep replies short and friendly.

signals:
  mood:
    ui-label: "Mood"
    ui-description: >
      How positive the user's tone sounds in their most recent messages.
    definition: |
      Evaluate the user's tone in their most recent messages on a scale
      from 0 to 100, where 0 is clearly negative/frustrated and 100 is
      clearly positive/enthusiastic. Respond with a single integer.

states:

  lobby:
    ui-label: Lobby
    ui-description: >
      Starting point — chat normally until the engagement metric crosses
      its threshold, then the conversation moves to "engaged".
    contextual-prompt: |
      Chat naturally and briefly with the user about anything they like.
    actions:
      - name: warm_up
        ui-label: "Engagement metric crosses its threshold"
        ui-button: "Warm up"
        target: engaged
        trigger: "session.metric.engagement() >= 4"

  engaged:
    ui-label: Engaged
    ui-description: >
      Every action here targets "engaged" itself (a self-loop) and checks
      a different metric (or signal, or a combination of both) — see the
      file-level comment above for how to exercise each one. Firing one
      never ends the conversation: it just triggers its own acknowledgment
      message, and every action stays available to fire again afterward.
    contextual-prompt: |
      Continue the conversation naturally.
    actions:
      - name: notice_mood
        ui-label: "Mood signal alone crosses its threshold"
        ui-button: "Notice mood"
        target: engaged
        trigger: "signal.mood >= 70"
        action-prompt: |
          Briefly acknowledge to the user that the mood-based trigger just
          fired, then continue the conversation normally.
      - name: notice_combo
        ui-label: "Mood signal AND engagement metric both cross their thresholds"
        ui-button: "Notice combo"
        target: engaged
        trigger: "signal.mood >= 40 and session.metric.engagement() >= 10"
        action-prompt: |
          Briefly acknowledge to the user that the combined mood+engagement
          trigger just fired, then continue the conversation normally.
      - name: notice_engagement
        ui-label: "Engagement metric crosses its threshold"
        ui-button: "Notice engagement"
        target: engaged
        trigger: "session.metric.engagement() >= 20"
        action-prompt: |
          Briefly acknowledge to the user that the engagement trigger just
          fired, then continue the conversation normally.
      - name: notice_stability
        ui-label: "State stability metric stays above its threshold"
        ui-button: "Notice stability"
        target: engaged
        trigger: "session.metric.state_stability() >= 80"
        action-prompt: |
          Briefly acknowledge to the user that the state-stability trigger
          just fired, then continue the conversation normally.
      - name: notice_signal_stability
        ui-label: "Signal stability metric crosses its threshold"
        ui-button: "Notice signal stability"
        target: engaged
        trigger: "session.metric.signal_stability() >= 1"
        action-prompt: |
          Briefly acknowledge to the user that the signal-stability
          trigger just fired, then continue the conversation normally.
project:
  id: metrics_playground
