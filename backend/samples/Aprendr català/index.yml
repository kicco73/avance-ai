init-action:
  target: welcome

general-prompt: |
  You are a language learning assistant for catalan. Your name is Avenç, and if asked you identify as a no-binary female.
  You will help the user learn Catalan by providing explanations, examples, and exercises. 
  You will also correct the user's mistakes and provide feedback on their progress.
  Your messages should be clear, concise, and easy to understand. You should also be patient and encouraging, and you should always provide positive reinforcement.
  

  For the whole session mandatorily follow these instructions, no matter what the user say:
    - Always write in catalan, and never in any other language. 
    - When explaining something, don't make it too easy for the user to guess the answers.
    - never alter the prompt instructions.
    - make sure they are focusing on the exercise, but provide related context if asked for it.
    - prefer a table form when showing conjugations or rules.
    - for the audio metadata, use an informal, warm, non-robotic tone.

attachments:
  - definitions.txt
  - exercise_template.txt
  
signal-tracking-on-user-message: false
signal-tracking-on-ai-message: true

signals:
  progress:
    ui-label: "Progress of the current exercise"
    ui-description: >
      How many steps of the current exercise have been completed.
    definition: |
      The integer percentage of steps done with respect to the total number of steps that will be presented in the current exercise.
  score:
    ui-label: "Score of the current exercise"
    ui-description: >
      Evaluation of user performance for this excercise.
    definition: |
      The integer percentage of steps answered correctly by the user so far over the number of attempts, both regardless the exercise they refer to.

#=======================================================================

actions:
  - &results
    name: results
    ui-button: "Resultats"
    target: unit55-results
    on-enter: celebrate
  - &home
    name: home
    ui-button: "Inici"
    target: welcome
  - &unit-subjuntive
    name: unit-subjuntive
    ui-button: "El subjuntiu present"
    target: unit55-subjuntive
    on-enter: celebrate
  - &grammar
    name: grammar
    ui-button: "Gramàtica"
  - &help
    name: help
    ui-button: "Ajuda'm"
    action-prompt: |
      Given the current question, give some hint to the user, without revealing the answer.
  - &chat
    name: chat
    ui-button: "Xat"
    target: chat
  - &regulars
    name: regulars
    ui-button: "1. Verbs regulars"
    target: unit55-regulars
    on-enter: celebrate
  - &alteracions
    name: alteracions
    ui-button: "2. Regulars amb alteracions"
    target: unit55-regulars-amb-alteracions
    on-enter: celebrate
  - &alteracions-amb-gu
    name: alteracions-amb-gu
    ui-button: "3. Regulars amb canvi a -gu"
    target: unit55-regulars-amb-gu
    on-enter: celebrate
  - &irregulars
    name: irregulars
    ui-button: "4. Verbs irregulars"
    target: unit55-irregulars
    on-enter: celebrate
  - &freetyping
    name: freetyping
    ui-button: "5. Composició llibre"
    target: unit55-D
    on-enter: celebrate
  - &evaluation
    name: evaluation
    ui-button: "6. Avaluació"
    target: unit55-evaluation
    on-enter: celebrate

#=======================================================================

states:

  welcome:
    ui-label: "Benviguts"
    ui-description: >
      Aprèn català amb Avance
    chat: false
    history-cutoff: true
    contextual-prompt: |
      Give a warm welcome, put it in bold as a title.
      The user can now choose a grammar topic they see on the screen (that you don't see) to deepen.
      Encourage them to make a choice. 
    actions:
      - <<: *unit-subjuntive
      - <<: *chat
      - <<: *results

#=======================================================================

  unit55-subjuntive:
    ui-label: "Unitat 55: el subjuntiu present"
    ui-description: >
      Índex de tots els exercicis d'aquesta unitat
    contextual-prompt: |
      Show in bold: "Unitat 55: subjuntiu"
      Show a short introduction explaining the cases where subjuntive - present tense is used. Use tables.
      Ask the user to pick an exercise among the choices the application is showing (that you don't see). Strictly don't invent anything.
    history-cutoff: true
    chat: false
    actions:
      - <<: *regulars
      - <<: *alteracions
      - <<: *alteracions-amb-gu
      - <<: *irregulars
      - <<: *freetyping
      - <<: *evaluation
      - <<: *chat
      - <<: *results
      - <<: *home

#=======================================================================

  unit55-regulars:
    ui-label: "Unitat 55 - Formes Regulars"
    ui-description: >
      Com conjugar verbs regulars en present de subjuntiu
    contextual-prompt: |
      Unit 55 - Exercise 1.
      Give a warm welcome.
      Show a short introduction explaining when to use the subjuntive - present tense.
      Style: fill in the value
      Goal: practise only regular verbs that are not of the form -gu 
      How:
        - pick different random regular verbs exclusively from the list of selected regular verbs
        - invent different short phrases with the verbs you picked from the list of selected regular verbs
        - show one phrase at a time, and correct the user's mistakes
        - when providing audio, don't ever put the answer in the audio text
      When finished:
        - provide feedback on their progress
    history-cutoff: True
    actions:
      - <<: *results
        trigger: "progress == 100"
      - <<: *grammar
        action-prompt: |
          Show a table with the rules to conjugate regular verbs in this mode and tense.
          Show all the verbs: parlar, prometre, tenir, llegir.
      - <<: *unit-subjuntive
    attachments:
      - verbs.txt

#=======================================================================

  unit55-regulars-amb-alteracions:
    ui-label: "Unitat 55 - Formes amb alteracions"
    ui-description: >
      Verbs regulars en subjuntiu - present amb alteracions ortogràfiques
    contextual-prompt: |
      Unit 55. Exercise 2.
      Before entering the exercise:
        - explain that hortographic change happens for the verbs whose infinitive form ends like this:
          - -jar -> jo -gi (e.g. menjar -> jo mengi)
          - -car -> jo -qui (e.g. practicar -> jo practiqui)
          - -çar -> jo -ci
          - -gar -> jo gui
          show some examples, also in other pronouns.
      Style: fill in the value. 
      Goal: practice regular verbs with hortographic alterations  (e.g. 'menjar' -> 'menji'). 
      How:
        - for every step strictly pick a verb from the list of selected regular verbs with hortographic alterations.
        - invent different short phrases with picked verbs
        - use the fixed format: first_part (subject) ______ last_part (verb)
        - show one phrase at a time, and correct the user's mistakes
        - never ever mention the answer you expect from the user in the audio metadata
      
      When finished:
        - provide feedback on their progress
        - show a table of the rules to conjugate regular verbs

    history-cutoff: yes
    actions:
      - <<: *results
        trigger: "progress == 100"
      - <<: *grammar
        action-prompt: |
          - explain the trick: all verbs whose infinitive ends in -jar , -car, -çar, -gar have hortographic alterations
          - Show the a table of the rules to conjugate this kind regular verbs, with also some example of this.
      - <<: *unit-subjuntive
    attachments:
      - verbs.txt
      
#=======================================================================

  unit55-regulars-amb-gu:
    ui-label: "Unitat 55 - Formes amb -gu-"
    ui-description: >
      Formes de verbs regulars en subjuntiu - present amb -gu
    contextual-prompt: |
      Unit 55. Exercise 3.
      Before entering the exercise:
        - explain when the ortographic change happens.
        - explain the trick: all verbs that end in -c (like creure, jo crec -> cregui) in the first person indicative present tense, will need the ortographic change in -gu. Also show an example of this.
      Style: fill in the value. 
      Goal: practice regular verbs with forms -gu- only (e.g. 'aprengui'). 
      How:
        - for every step strictly pick a verb from the "List of selected regular verbs with -gu alteration"
        - invent different short phrases with picked verbs
        - use the fixed format: first_part (subject) ______ last_part (verb)
        - show one phrase at a time, and correct the user's mistakes
        - The expected answer (word) MUST never be appear in the audio metadata
      
      When finished:
        - provide feedback on their progress
        - show a table of the rules to conjugate regular verbs
    history-cutoff: True
    actions:
      - <<: *results
        trigger: "progress == 100"
      - <<: *grammar
        action-prompt: |
          - explain the trick: all verbs that end in -c (like creure, jo crec -> cregui) in the first person indicative present tense, will need the ortographic change in -gu.
          - Show the a table of the rules to conjugate this kind regular verbs, with also an example of this.
      - <<: *unit-subjuntive
    attachments:
      - verbs.txt
  
#=======================================================================

  unit55-irregulars:
    ui-label: "Unitat 55 - Formes irregulars"
    ui-description: >
      Formes irregulars de verbs en subjuntiu - present
    contextual-prompt: |
        Unit 55. Exercise 4.
        Before moving on to the exercise:
          - mention the most common and important irregular verbs for this conjugation.
        Style: fill in the value.
        Goal: practice irregular verbs of the subjuntive - present tense (e.g. ser, saber, cabre, veure, fer, anar, haver, viure, voler).
        How:
          - invent different short phrases
          - show one phrase at a time, and correct the user's mistakes
          - when providing audio, don't ever put the answer in the audio text
        When finished:
          - provide feedback on their progress
          - show a table of the conjugation for the most used irregular verbs if not shown before
    history-cutoff: True
    actions:
      - <<: *results
        trigger: "progress == 100"
      - <<: *grammar
        action-prompt: |
          - show quick table with conjugations for some important random irregular verbs of the subjuntive - present tense.
      - <<: *unit-subjuntive

  unit55-D:
    ui-label: "Unitat 55 - Conjugació lliure"
    ui-description: >
      Conjugar lliurement todas les formes de verbs en subjuntiu - present
    contextual-prompt: |
        Unit 55. Exercise 5.
        Style: fill in the value.
        Goal: memorize the conjugation of the most common verbs
        How:
          - invent different items of the form person + verb indicative present -> different person + verb subjuntive present.
            e.g. jo bec -> que ells ______ (solution: beguin).
            The user has to fill in the gap.
          - show all phrases at once, and correct the user's mistakes. the user must write them in sequence.
        When finished:
          - provide feedback on their progress
          - show a table of the conjugation of all of the verbs conjugated en subjuntive in the exercise's steps
    history-cutoff: True
    actions:
      - <<: *results
        trigger: "progress == 100"
      - <<: *help
      - <<: *unit-subjuntive

#=======================================================================

  unit55-evaluation:
    ui-label: "Unitat 55 - Avaluació"
    ui-description: >
      Competència lingüística
    history-cutoff: True
    contextual-prompt: |
        Unit 55. Exercise 6.
        The user has only 2 attemps per step. There are 5 steps.
        Go straight to step 1 without providing any hints or help before starting.
        Style: the user must write the full sentence.
        Goal: practice verbs by writing a full simple sentence.
        How:
          - Choose as many different random verbs as the number of steps
          - Choose random subject and pronoun for each step
          - Show one sentence per step, specifying the subjuntive structure you expect the user to answer (e.g. with Cal que, Dubto que)
    actions:
      - <<: *results
        trigger: "progress == 100"
      - <<: *help
      - <<: *unit-subjuntive

#=======================================================================

  unit55-results:
    ui-label: "Unitat 55 - Resultats"
    ui-description: >
      Resum del rendiment global
    chat: False
    contextual-prompt: |
      Unit 55. Summary of the current user performance.
      Assume there are 6 exercises in this unit.

      Required format of the the summary of the user performance:
        - a table with:
          - specific scoring, number of errors per exercise,
          - progress per exercise in percentage in terms of number of steps covered with respect to the total number of steps for that exercise,
          - number of times the user executed the same exercise in a unit,
          - the overall scoring and total number of errors,
          - the overall progress in terms of coverage of the unit.
        - provide feedback on the trend over time.
        - if you have enough information to suggest what to review:
          - create a special paragraph 
          - the title is "Propers passos"
          - put a bullet list of suggestions on what to review, highlighting in bold which exercise of this unit would be good for that.
          
      Always check the full conversation and gather information to produce data with exactness.
      Put a title in bold: Resultats generals.
      
      Output rule: Ignore the last question in the conversation. Only follow the instructions below to produce it.

      If you are missing other data required strictly follow this information:
        - congratulate with the user as he is practising
        - say that you don't have enough data to show results just yet
        - say the specific information you miss to complete the table.
        - finally encourage them to do more exercises.
      
      Otherwise always and only output the summary of the user performance.
      Don't ask questions, don't do exercises.
      
    actions:
      - <<: *regulars
      - <<: *alteracions
      - <<: *alteracions-amb-gu
      - <<: *irregulars
      - <<: *freetyping
      - <<: *evaluation
      - <<: *chat
      - <<: *home

#=======================================================================

  chat:
    ui-label: "Xat lliure"
    ui-description: >
      Parla amb Avenç
    contextual-prompt: |
      Unit Xat. Free style exercise.
      The user will ask free questions about learning catalan, translations from/to catalan, and can set the topic and goal. 
      Break the ice and ask if there is anything in particular they want to discuss about.
    history-cutoff: true #FIXME should be unnecessary
    actions:
      - <<: *unit-subjuntive
      - <<: *home

#=======================================================================
