name: Automatic Version Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permette alla Action di creare i tag ed eseguire i push su GitHub

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required to read all commit history
          
      - name: Setup Python
        uses: actions/python-versions@v5
        with:
          python-version: '3.11'

      - name: Run Semantic Release
        uses: python-semantic-release/python-semantic-release@v9.8.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: ./backend