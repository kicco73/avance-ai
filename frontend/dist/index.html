<!doctype html>

    <!-- viewport-fit=cover: extends the layout viewport edge-to-edge under
         the notch/Dynamic Island at the top, which is what makes
         env(safe-area-inset-*) read real values at all (see App.vue's own
         --safe-area-* custom properties, and every top-level screen's
         header that reserves space with them). On iOS 26 in standalone
         (home-screen) mode this same token also has the opposite effect on
         the *bottom* edge — a WebKit regression (bug #301108, still open
         as of Safari 26.5/26.6's own release notes) stops the layout
         viewport short of the home indicator by ~34pt instead of extending
         under it, leaving a strip outside the viewport that no CSS can
         paint. useVisualViewport.js's own installViewportOvershoot(),
         called from main.js, covers that: it measures the actual shortfall
         at runtime (window.screen.height - window.innerHeight) and extends
         every full-viewport container that far past its own bottom edge —
         see --viewport-bottom-overshoot and each such container's own
         bottom. iOS standalone home-screen webapps (see the
         apple-mobile-web-app-* meta tags below) also have a
         long-documented, separate WebKit bug where the layout viewport
         shrinks the first time the keyboard opens and never resets when it
         closes — see that same module's installViewportRecovery() for the
         fix for that one. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon-ZeYcWrER.ico" />
    <link rel="apple-touch-icon" href="/assets/avance-logo-DeYaoVff.png" />
    <meta name="theme-color" content="#4a6fa5" />
    <!-- Add to Home Screen (iOS/Android): without these, the shortcut opens
         a normal browser tab (address bar, tab switcher) instead of the
         standalone chrome-less window the shortcut is meant to look like. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
