<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: renders edge-to-edge on a notched/rounded-corner
         device instead of confining content to the safe area on its own —
         individual screens reserve the unsafe edges themselves with
         env(safe-area-inset-*) padding (see App.vue's own --safe-area-*
         custom properties). iOS standalone home-screen webapps (see the
         apple-mobile-web-app-* meta tags below) have a long-documented
         WebKit bug where the layout viewport shrinks the first time the
         keyboard opens and never resets when it closes — see
         useVisualViewport.js's own installViewportRecovery(), called from
         main.js, for the actual fix for that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="/src/assets/avance-logo.png" />
    <meta name="theme-color" content="#4a6fa5" />
    <!-- Add to Home Screen (iOS/Android): without these, the shortcut opens
         a normal browser tab (address bar, tab switcher) instead of the
         standalone chrome-less window the shortcut is meant to look like. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Avance" />
    <title>Avance</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
