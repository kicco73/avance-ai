server {
    listen 80;
    client_max_body_size 100m;

    root /app/frontend/dist;

    location / {
        try_files $uri /index.html;
    }

    # index.html references the hashed asset filenames of one exact build;
    # a cached copy keeps a phone pinned to that old build even after the
    # container is rebuilt (iOS home-screen webapps cache heuristically
    # when no Cache-Control is sent, and the About-dialog version comes
    # from the backend API, so it looks up to date regardless). no-store
    # forces a fresh index.html on every launch; the assets it names are
    # content-hashed, so those can be cached forever instead.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://localhost:8000;
    }

    location /ws/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}